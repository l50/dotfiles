---
name: Dotfile tests
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]
  # Run once a week (see https://crontab.guru)
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Cancel any in-progress job when a new workflow is triggered
concurrency:
  cancel-in-progress: true
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}

env:
  BATS_VERSION: 1.12.0

jobs:
  bats_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup git config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              sudo apt-get update
              sudo apt-get install -y curl git zsh
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              brew install curl git zsh python3 ansible
          fi

      # Pinned to a commit rather than main: an unrelated merge upstream would otherwise
      # turn this workflow red with no change on our side. Renovate bumps the digests.
      - name: Install workstation collection
        run: ansible-galaxy collection install git+https://github.com/cowdogmoo/workstation.git,3032f38f6669d6e29511b587359f6060450eed65

      - name: Install the dotfiles
        run: |
          chmod +x install_dotfiles.sh
          if ./install_dotfiles.sh --skip-ansible; then
            echo "Dotfiles installed successfully"
          else
            echo "Dotfiles installation failed"
            exit 1
          fi

      - name: Setup test environment
        run: |
          # Create necessary directories
          mkdir -p ~/.dotfiles/files

          # Create test cobra.yaml
          cat > ~/.dotfiles/files/cobra.yaml << 'EOF'
          author: test <test@example.com>
          license: MIT
          useViper: true
          EOF

      - name: Setup BATS
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: ${{ env.BATS_VERSION }}

      - name: Run Bats tests
        run: bats tests/test-go.bats

  dotfile_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Clone git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup git config
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.1"

      - name: Install go module dependencies
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          go install github.com/magefile/mage@latest
          go install github.com/dolmen-go/goeval@latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              sudo apt-get update
              sudo apt-get install -y curl git zsh build-essential
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              brew install curl git zsh python3 ansible
          fi

      # Pinned to commits rather than main: an unrelated merge upstream would otherwise
      # turn this workflow red with no change on our side. Renovate bumps the digests.
      - name: Install the necessary ansible collections
        run: |
          ansible-galaxy collection install git+https://github.com/cowdogmoo/workstation.git,3032f38f6669d6e29511b587359f6060450eed65
          ansible-galaxy collection install git+https://github.com/grafana/grafana-ansible-collection.git,521b006dabf4f605e9663c6539bfdec653badb1b

      - name: Install the dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x install_dotfiles.sh
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            export PATH=$PATH:/Users/runner/hostedtoolcache/Python/3.12.4/arm64/bin
          fi
          if ./install_dotfiles.sh; then
            echo "Dotfiles installed successfully"
          else
            echo "Dotfiles installation failed"
            exit 1
          fi

      - name: Confirm dotfiles are installed and working
        run: |
          source ~/.zshrc
          cat ~/.zshrc
          source ~/.dotfiles/python.sh
          ls -lart ~/.dotfiles
          which ipaddr
          which go
          which run_playbook
        shell: zsh {0}
